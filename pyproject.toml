[project]
name = "data-exploring"
version = "0.1.0"
description = "Usdkrw-korean-equity-returns-analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "scipy",
    "statsmodels",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
